  <main class="wrap">
    <nav class="card games" role="tablist" aria-label="Spielmodi">
      <button role="tab" class="game active" data-game="classic">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10M15 10v10"/></svg><span>Klassik</span></button>
      <button role="tab" class="game" data-game="career">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="19" cy="14" r="2"/><path d="M6.4 16.6l4.2-7M13.6 9.2l4 3.6"/></svg><span>Karriere</span></button>
      <button role="tab" class="game" data-game="grid">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg><span>Raster</span></button>
      <button role="tab" class="game" data-game="mates">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.5 14.2A6 6 0 0 1 22 20"/></svg><span>Mitspieler</span></button>
      <button role="tab" class="game" data-game="lineup">
        <svg viewBox="0 0 24 24"><rect x="3" y="2" width="18" height="20" rx="2"/><path d="M3 12h18"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="6" r=".8" fill="currentColor"/><circle cx="8" cy="17" r=".8" fill="currentColor"/><circle cx="16" cy="17" r=".8" fill="currentColor"/></svg><span>Wer fehlt</span></button>
      <button role="tab" class="game" data-game="draft">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 15.4 6.8 18.1l1-5.8L3.5 8.2l5.9-.9z"/></svg><span>Draft</span></button>
    </nav>

    <div id="classic">
    <section class="card play">
      <div class="sub-modes" role="tablist">
        <button class="sub-mode active" data-sub="daily">Täglich</button>
        <button class="sub-mode" data-sub="endless">Endlos</button>
      </div>
      <div class="play-top">
        <b id="play-title"></b>
        <span class="play-right">
          <span id="play-count"></span>
          <button class="btn test-btn" id="btn-test" hidden title="Nur zum Testen – zählt nicht für die Statistik">↻ Neues Rätsel (Test)</button>
        </span>
      </div>

      <p class="yesterday" id="yesterday" hidden></p>
      <div class="endless-bar" id="endless-bar" hidden>
        <label>Schwierigkeit
          <select id="difficulty">
            <option value="leicht">Leicht</option>
            <option value="mittel">Mittel</option>
            <option value="schwer">Schwer</option>
          </select>
        </label>
        <span class="spacer"></span>
        <button class="btn" id="btn-new">Neuer Spieler</button>
        <button class="btn danger" id="btn-giveup">Aufgeben</button>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="Spielername eingeben …"
               aria-label="Spieler suchen" role="combobox" aria-expanded="false" aria-controls="suggestions">
        <ul id="suggestions" role="listbox" hidden></ul>
      </div>
      <label class="assist"><input type="checkbox" id="assist"> Hilfe-Modus: unpassende Spieler in der Suche ausgrauen</label>

      <div class="hints" id="hints"></div>
    </section>

    <section id="board" aria-live="polite"></section>

    <div class="legend">
      <span><i class="hit"></i>richtig</span>
      <span><i class="near"></i>knapp / teilweise</span>
      <span><i class="miss"></i>falsch</span>
    </div>
    </div><!-- /#classic -->

    <!-- Karriere, Raster, Mitspieler, Wer fehlt: werden von modes.js hier aufgebaut -->
    <div id="other-mode" hidden></div>
  </main>
