<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccerdle – Stil 4: Fußball-Retro</title>
<link rel="stylesheet" href="stile-base.css">
<style>
  /* Stil 4 – Fußball-Retro (70er/80er): Papier-Creme, Trikotstreifen, Panini-Sticker, Eintrittskarten, Offset-Schatten, Slab-Serif */
  :root { --paper: #f1e7cf; --card: #fbf4e0; --ink: #251f19; --muted: #7a6c58; --green: #1f4d33; --green2: #2f7d4f; --red: #b3382c; --gold: #d8a31c; --line: #cdbf9f;
    --slab: "Rockwell", "Roboto Slab", "Cambria", Georgia, serif; --num: "Barlow Condensed", "Arial Narrow", sans-serif; }
  body { color: var(--ink); font: 15px/1.5 Georgia, "Times New Roman", serif; background-color: var(--paper);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .muted { color: var(--muted); }
  .app { padding-top: 0; }
  .top { margin: 0 -16px; padding: 16px 16px 14px; background: var(--green); color: #fbf4e0; border-bottom: 6px double var(--gold); position: relative; }
  .top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -22px; height: 10px; background: repeating-linear-gradient(90deg, var(--green) 0 26px, #fbf4e0 26px 52px); }
  .logo-mark svg { width: 62px; height: 62px; filter: drop-shadow(2px 3px 0 rgba(0,0,0,.35)); }
  .wm { font-family: var(--slab); font-weight: 900; font-size: 30px; letter-spacing: .12em; text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
  .w2 { color: var(--gold); }
  .logo-txt small { font-style: italic; color: #cfe0c9; letter-spacing: .08em; }
  .tools button { background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 50%; box-shadow: 2px 2px 0 rgba(0,0,0,.45); }
  .tabs { margin-top: 38px; gap: 6px; }
  .tabs button { background: var(--card); border: 2px solid var(--ink); border-radius: 8px 8px 0 0; color: var(--ink); font-family: var(--slab); text-transform: uppercase; letter-spacing: .05em; padding: 9px 2px; box-shadow: 0 -2px 0 rgba(0,0,0,.05); }
  .tabs button.on { background: var(--red); color: #fbf4e0; transform: translateY(-3px); box-shadow: 3px 0 0 var(--ink); }
  .tabs svg { width: 18px; height: 18px; stroke-width: 2.2; }
  .card { background: var(--card); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 5px 5px 0 var(--ink); }
  .subtabs button { background: none; border: 2px solid var(--ink); border-radius: 999px; font-family: var(--slab); text-transform: uppercase; font-size: 12px; letter-spacing: .08em; }
  .subtabs .on { background: var(--ink); color: var(--card); }
  .play-top b { font-family: var(--slab); font-size: 24px; text-transform: uppercase; letter-spacing: .06em; border-bottom: 4px solid var(--red); padding-bottom: 2px; }
  .yest { font-style: italic; color: var(--muted); } .yest b { color: var(--ink); }
  .search { border: 2px solid var(--ink); border-radius: 4px; background: #fff; color: var(--muted); box-shadow: inset 2px 2px 0 rgba(0,0,0,.08); }
  .hint { border: 2px dashed var(--ink); border-radius: 4px; color: var(--muted); background: rgba(255,255,255,.45); }
  .hint i { color: var(--red); font-family: var(--slab); } .hint.open { border-style: solid; background: var(--gold); color: var(--ink); }
  .hint.open i { color: var(--ink); }
  .g-head em { font-family: var(--slab); color: var(--muted); }
  .g-row { border-top: 2px dotted var(--line); }
  .g-name b { font-family: var(--slab); text-transform: uppercase; letter-spacing: .02em; } .g-name small { font-style: italic; color: var(--muted); }
  /* Panini-Sticker: farbige Fläche, cremefarbener Innenrahmen, Tinten-Rand */
  .t { color: #fbf4e0; border: 2px solid var(--ink); border-radius: 4px; font-family: var(--num); font-size: 19px; font-weight: 700; letter-spacing: .02em; box-shadow: inset 0 0 0 3px #fbf4e0, 2px 2px 0 var(--ink); }
  .t.hit { background: var(--green2); } .t.near { background: var(--gold); color: var(--ink); } .t.miss { background: var(--red); }
  .g-row.win .g-name b { color: var(--red); }
  .flag { width: 28px; height: 19px; border: 1px solid var(--ink); border-radius: 0; }
  .legend { font-style: italic; color: var(--muted); } .legend i { border: 1.5px solid var(--ink); border-radius: 2px; }
  .legend .hit { background: var(--green2); } .legend .near { background: var(--gold); } .legend .miss { background: var(--red); }
  .d-score span { font-family: var(--slab); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--muted); }
  .d-score b { font-family: var(--num); font-size: 62px; color: var(--red); text-shadow: 3px 3px 0 var(--ink); }
  .pitch { border: 3px solid var(--ink); border-radius: 4px; background: repeating-linear-gradient(0deg, #3f8a4c 0 11%, #377d44 11% 22%); box-shadow: 4px 4px 0 var(--ink); }
  .pitch::before { content: ""; position: absolute; inset: 10px; border: 3px solid rgba(251,244,224,.9); }
  .pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26%; aspect-ratio: 1; translate: -50% -50%; border: 3px solid rgba(251,244,224,.9); border-radius: 50%; }
  /* Spieler als Sammelbild */
  .slot.filled { background: #fbf4e0; border: 2px solid var(--ink); border-radius: 3px; box-shadow: inset 0 0 0 3px #fff, 3px 3px 0 var(--ink); transform: rotate(-1.2deg); }
  .slot.filled:nth-child(even) { transform: rotate(1.2deg); }
  .slot .r { font-family: var(--num); font-size: 26px; color: #fbf4e0; background: var(--red); border: 2px solid var(--ink); border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; margin-top: -22px; box-shadow: 2px 2px 0 var(--ink); }
  .slot .n { font-family: var(--slab); text-transform: uppercase; font-size: 11px; margin-top: 3px; } .slot small { color: var(--muted); font-style: italic; }
  .slot.empty { border: 2px dashed #fbf4e0; color: #fbf4e0; border-radius: 3px; background: rgba(0,0,0,.14); font-family: var(--slab); }
  .slot.pend { outline: 3px solid var(--gold); }
  .acts .ok { background: var(--green2); color: #fff; border: 2px solid var(--ink); } .acts .undo { background: var(--card); border: 2px solid var(--ink); }
  .intro { font-style: italic; color: var(--muted); } .intro b { color: var(--ink); font-style: normal; }
  /* Eintrittskarte */
  .offer { background: #fff7de; border: 2px solid var(--ink); border-radius: 4px; position: relative; font-family: var(--slab); }
  .offer::before, .offer::after { content: ""; position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink); translate: 0 -50%; }
  .offer::before { left: -8px; } .offer::after { right: -8px; }
  .offer b { font-family: var(--num); color: var(--red); font-size: 26px; } .offer small { font-style: italic; color: var(--muted); }
  .offer.on { background: var(--gold); box-shadow: 3px 3px 0 var(--ink); }
  .offer.on b { color: var(--ink); }
  .pl { background: #fff; border: 2px solid var(--ink); border-radius: 3px; } .pl em { font-family: var(--slab); color: var(--red); } .pl b { font-family: var(--num); font-size: 22px; color: var(--green); }
  footer { font-style: italic; color: var(--muted); } footer::before { content: "★ EST. 2026 ★"; display: block; font-style: normal; letter-spacing: .3em; font-family: var(--slab); color: var(--ink); margin-bottom: 4px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="stile.js"></script>
<script>
  // Wappen-Emblem: Ring mit Schriftband, Ball in der Mitte
  renderMock(document.getElementById('app'), { logo: `<span class="logo-mark"><svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47" fill="#d8a31c" stroke="#251f19" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="#fbf4e0" stroke="#251f19" stroke-width="2.5"/>
    <defs><path id="ring" d="M50 50 m-42 0 a42 42 0 1 1 84 0 a42 42 0 1 1 -84 0"/></defs>
    <text font-family="Georgia,serif" font-weight="700" font-size="9.5" letter-spacing="2" fill="#251f19"><textPath href="#ring" startOffset="2">★ SOCCERDLE ★ CHAMPIONS LEAGUE ★</textPath></text>
    <circle cx="50" cy="50" r="22" fill="#fff" stroke="#251f19" stroke-width="2.5"/><path d="m50 38 10 7.3-3.8 11.7H43.8L40 45.3z" fill="#251f19"/>
    <path d="M50 38V28M60 45.3l9.5-3M56.2 57l6 8M43.8 57l-6 8M40 45.3l-9.5-3" stroke="#251f19" stroke-width="2.5" fill="none"/></svg></span>` });
</script>
</body>
</html>
