<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccerdle – Retro D: Konsolen-Menü 2005 (Hommage)</title>
<link rel="stylesheet" href="stile-base.css">
<style>
  /* Retro D – Hommage an die Konsolen-Menüs um 2005/06: dunkles Graphit-Blau, Glas-Panels mit Glanzkante, schräge Menüleisten, Orange als Auswahl,
     Positionsfarben (Rot/Grün/Blau/Gelb), Flutlicht-Rasen. Keine Originalgrafiken, nur die Stimmung. */
  :root { --bg0: #05070d; --bg1: #0b1426; --panel: rgba(18,30,52,.88); --edge: rgba(150,190,255,.28); --text: #eaf2ff; --muted: #8fa3c4; --blue: #2e8bff; --cyan: #5fd0ff;
    --orange: #ff8a1f; --orange2: #ffc13b; --hit: #19b35a; --near: #f2b21c; --miss: #d83a3a; --att: #e0483c; --mid: #2fb55a; --def: #2f7de1; --gk: #e8c41f;
    --font: "Barlow Condensed", "Arial Narrow", "Bahnschrift", sans-serif; }
  body { color: var(--text); font: 600 15px/1.45 "Inter", system-ui, sans-serif; min-height: 100vh;
    background:
      radial-gradient(700px 380px at 82% -8%, rgba(46,139,255,.38), transparent 65%),
      radial-gradient(560px 300px at 8% 4%, rgba(95,208,255,.16), transparent 70%),
      repeating-linear-gradient(115deg, transparent 0 46px, rgba(120,170,255,.045) 46px 48px),
      linear-gradient(180deg, var(--bg1), var(--bg0) 60%); background-attachment: fixed; }
  .muted { color: var(--muted); }
  .top { padding: 20px 0 12px; }
  .logo-mark svg { width: 54px; height: 54px; filter: drop-shadow(0 0 10px rgba(95,208,255,.6)); }
  .wm { font-family: var(--font); font-weight: 700; font-size: 44px; line-height: .9; font-style: italic; letter-spacing: .02em; text-transform: uppercase; transform: skewX(-8deg); display: inline-block;
    background: linear-gradient(180deg, #fff 0 45%, #b9d3f5 50%, #7ea3d6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
  .w2 { background: linear-gradient(180deg, #ffe08a 0 45%, var(--orange) 50%, #d05a00 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo-txt small { font-family: var(--font); letter-spacing: .3em; text-transform: uppercase; color: var(--cyan); font-size: 12px; margin-top: 4px; }
  .tools button { background: linear-gradient(180deg, #2a3f66, #111c33); border: 1px solid var(--edge); color: var(--text); border-radius: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .tools button:hover { border-color: var(--orange); color: var(--orange2); }
  /* schräge Menüleiste */
  .tabs { gap: 3px; padding: 6px; background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02) 50%, rgba(0,0,0,.25) 51%); border: 1px solid var(--edge); border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .tabs button { flex-direction: row; justify-content: center; gap: 7px; color: var(--muted); font-family: var(--font); font-size: 17px; text-transform: uppercase; letter-spacing: .08em;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); background: rgba(255,255,255,.04); padding: 11px 6px; }
  .tabs span { font-size: 17px; }
  .tabs button.on { color: #1a0d00; background: linear-gradient(180deg, #ffd47a, var(--orange) 55%, #e06d00); text-shadow: 0 1px 0 rgba(255,255,255,.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }
  main { margin-top: 14px; }
  /* Glas-Panel mit Glanzkante und Titelleiste */
  .card { background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.02) 22%, rgba(0,0,0,0) 22%), var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 18px;
    box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.22); clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); }
  .subtabs button { background: linear-gradient(180deg, #24385e, #101b31); border: 1px solid var(--edge); font-family: var(--font); font-size: 16px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-radius: 4px; margin-right: 3px; }
  .subtabs .on { color: #1a0d00; background: linear-gradient(180deg, #ffd47a, var(--orange)); border-color: var(--orange2); }
  .play-top b { font-family: var(--font); font-size: 32px; font-style: italic; text-transform: uppercase; letter-spacing: .04em; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  .play-top b::before { content: ""; display: inline-block; width: 6px; height: 26px; margin-right: 10px; vertical-align: -3px; background: linear-gradient(180deg, var(--orange2), var(--orange)); transform: skewX(-12deg); }
  .yest { color: var(--muted); } .yest b { color: var(--orange2); }
  .search { background: linear-gradient(180deg, #060b16, #0f1a30); border: 1px solid var(--edge); border-radius: 4px; color: var(--muted); box-shadow: inset 0 2px 6px rgba(0,0,0,.7); }
  .search:focus-within { border-color: var(--orange); box-shadow: inset 0 2px 6px rgba(0,0,0,.7), 0 0 0 2px rgba(255,138,31,.3); }
  .hint { background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border: 1px solid var(--edge); border-radius: 4px; color: var(--muted); }
  .hint i { font-family: var(--font); font-size: 14px; letter-spacing: .12em; color: var(--cyan); }
  .hint.open { background: linear-gradient(180deg, #ffb84a, #e46c00); color: #1a0d00; border-color: var(--orange2); } .hint.open i { color: #5a2c00; }
  .g-head em { font-family: var(--font); font-size: 14px; letter-spacing: .14em; color: var(--cyan); }
  .g-row { border-top: 1px solid rgba(150,190,255,.14); }
  .g-name b { font-family: var(--font); font-size: 19px; text-transform: uppercase; letter-spacing: .03em; } .g-name small { color: var(--muted); }
  /* Gel-Kacheln */
  .t { position: relative; overflow: hidden; border-radius: 4px; color: #fff; font-family: var(--font); font-size: 19px; letter-spacing: .03em; border: 1px solid rgba(0,0,0,.5); text-shadow: 0 1px 0 rgba(0,0,0,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 3px 8px rgba(0,0,0,.4); }
  .t::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 48%; background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,.06)); }
  .t.hit { background: linear-gradient(180deg, #2fd478, #0e8f45); } .t.near { background: linear-gradient(180deg, #ffd15c, #d99200); color: #2a1900; text-shadow: none; } .t.miss { background: linear-gradient(180deg, #f35d5d, #ad2020); }
  .flag { position: relative; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  .g-row.win .g-name b { color: var(--orange2); }
  .legend { color: var(--muted); } .legend .hit { background: var(--hit); } .legend .near { background: var(--near); } .legend .miss { background: var(--miss); }
  .d-score { position: relative; }
  .d-score span { font-family: var(--font); letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); font-size: 15px; }
  .d-score b { font-family: var(--font); font-size: 76px; line-height: .9; font-style: italic; color: #fff; text-shadow: 0 0 22px rgba(95,208,255,.7), 0 3px 0 rgba(0,0,0,.6); }
  /* Flutlicht-Rasen */
  .pitch { border: 1px solid var(--edge); border-radius: 4px; background: radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.22), transparent 62%), repeating-linear-gradient(0deg, #1f7a3d 0 8.33%, #1a6c36 8.33% 16.66%);
    box-shadow: inset 0 0 40px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.5); }
  .pitch::before { content: ""; position: absolute; inset: 12px; border: 2px solid rgba(255,255,255,.75); }
  .pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 24%; aspect-ratio: 1; translate: -50% -50%; border: 2px solid rgba(255,255,255,.75); border-radius: 50%; }
  /* Spielerkarte: dunkles Glas + Positionsfarbe links + Rating-Plakette */
  .slot.filled { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.03) 45%, rgba(0,0,0,.35) 46%), #0f1a30; border: 1px solid rgba(255,255,255,.35); border-left: 5px solid var(--pc, var(--blue)); border-radius: 4px; box-shadow: 0 6px 14px rgba(0,0,0,.55); width: 92px; }
  [data-pos="ST"], [data-pos="LA"], [data-pos="RA"], [data-pos="ZOM"] { --pc: var(--att); }
  [data-pos="ZM"], [data-pos="ZDM"], [data-pos="LM"], [data-pos="RM"] { --pc: var(--mid); }
  [data-pos="IV"], [data-pos="LV"], [data-pos="RV"] { --pc: var(--def); }
  [data-pos="TW"] { --pc: var(--gk); }
  .slot .r { font-family: var(--font); font-size: 28px; font-style: italic; color: #fff; text-shadow: 0 0 10px var(--pc, #fff); }
  .slot .n { font-family: var(--font); font-size: 14px; text-transform: uppercase; letter-spacing: .05em; } .slot small { color: var(--pc); font-weight: 800; }
  .slot.empty { border: 2px dashed rgba(255,255,255,.55); color: #fff; border-radius: 4px; background: rgba(0,0,0,.28); font-family: var(--font); font-size: 18px; }
  .slot.pend { box-shadow: 0 0 0 2px var(--orange), 0 0 24px rgba(255,138,31,.7); }
  .acts .ok { background: linear-gradient(180deg, #2fd478, #0e8f45); color: #fff; border: 1px solid #000; } .acts .undo { background: linear-gradient(180deg, #3b4f7a, #17233f); color: #fff; border: 1px solid #000; }
  .intro { color: var(--muted); } .intro b { color: var(--text); }
  .offer { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.02) 50%, rgba(0,0,0,.25) 51%); border: 1px solid var(--edge); border-radius: 4px; font-family: var(--font); clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
  .offer span { text-transform: uppercase; letter-spacing: .06em; font-size: 16px; } .offer b { font-size: 28px; font-style: italic; color: #fff; line-height: 1; } .offer small { color: var(--cyan); font-size: 14px; font-family: "Inter", sans-serif; }
  .offer.on { background: linear-gradient(180deg, #ffc760, var(--orange) 50%, #d96500 51%); color: #1a0d00; border-color: var(--orange2); } .offer.on b { color: #1a0d00; } .offer.on small { color: #5a2c00; }
  .pl { background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border: 1px solid var(--edge); border-left: 5px solid var(--pc, var(--blue)); border-radius: 3px; }
  .pl em { font-family: var(--font); font-size: 16px; color: var(--pc); } .pl b { font-family: var(--font); font-size: 24px; font-style: italic; color: #fff; }
  footer { color: var(--muted); letter-spacing: .08em; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="stile.js"></script>
<script>
  // Ball mit Orbit-Ring und Glanz
  renderMock(document.getElementById('app'), { logo: `<span class="logo-mark"><svg viewBox="0 0 64 64"><defs><radialGradient id="b" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#cfe0f7"/><stop offset="1" stop-color="#7ea3d6"/></radialGradient></defs>
    <ellipse cx="32" cy="34" rx="30" ry="9" fill="none" stroke="#ff8a1f" stroke-width="3" transform="rotate(-18 32 34)" opacity=".9"/>
    <circle cx="32" cy="32" r="19" fill="url(#b)" stroke="#05070d" stroke-width="2"/><path d="m32 21 8 5.8-3 9.4H27l-3-9.4z" fill="#0b1426"/><path d="M32 21v-7M40 26.8l7-2.4M37 36.2l4.6 6M27 36.2l-4.6 6M24 26.8l-7-2.4" stroke="#0b1426" stroke-width="2.4" fill="none"/>
    <path d="M10 44q22 12 46-6" fill="none" stroke="#ff8a1f" stroke-width="3" opacity=".9"/></svg></span>` });
</script>
</body>
</html>
