<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccerdle – Stil 2: Hyper-modern</title>
<link rel="stylesheet" href="stile-base.css">
<style>
  /* Stil 2 – hyper-modern: dunkle Glas-Karten (Glassmorphism), Neon-Limette + Violett, Mesh-Verlauf, große Typo, schwebende Pill-Navigation */
  :root { --bg: #07080c; --text: #f3f5fa; --muted: #98a0b3; --lime: #c8ff3d; --violet: #8b5cf6; --cyan: #22d3ee; --glass: rgba(255,255,255,.055); --edge: rgba(255,255,255,.12); }
  body { color: var(--text); font: 15px/1.45 "Inter", system-ui, sans-serif; background:
    radial-gradient(900px 500px at 12% -10%, rgba(139,92,246,.35), transparent 60%),
    radial-gradient(800px 500px at 95% 5%, rgba(200,255,61,.16), transparent 60%),
    radial-gradient(700px 600px at 50% 110%, rgba(34,211,238,.18), transparent 60%), var(--bg); background-attachment: fixed; }
  .muted { color: var(--muted); }
  .logo-mark svg { width: 38px; height: 38px; filter: drop-shadow(0 0 14px rgba(200,255,61,.55)); }
  .wm { font-weight: 800; font-size: 26px; letter-spacing: -.045em; }
  .w2 { background: linear-gradient(90deg, var(--lime), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo-txt small { color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .tools button { border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); border-radius: 14px; color: var(--text); }
  .tools button:hover { border-color: var(--lime); color: var(--lime); }
  .tabs { background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--edge); border-radius: 999px; padding: 6px; gap: 4px; position: sticky; top: 10px; z-index: 5; }
  .tabs button { color: var(--muted); border-radius: 999px; flex-direction: row; justify-content: center; gap: 7px; padding: 10px 6px; transition: .2s; }
  .tabs button.on { background: var(--lime); color: #0b0f05; font-weight: 700; box-shadow: 0 0 26px rgba(200,255,61,.45); }
  .card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--edge); border-radius: 28px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }
  .subtabs button { border: 1px solid var(--edge); background: none; border-radius: 999px; color: var(--muted); font-size: 13px; }
  .subtabs .on { background: rgba(255,255,255,.1); color: var(--text); }
  .play-top b { font-size: 30px; font-weight: 800; letter-spacing: -.04em; }
  .yest { color: var(--muted); } .yest b { color: var(--lime); }
  .search { border-radius: 18px; background: rgba(0,0,0,.35); border: 1px solid var(--edge); color: var(--muted); height: 54px; }
  .search:focus-within { border-color: var(--lime); box-shadow: 0 0 0 4px rgba(200,255,61,.12), 0 0 30px rgba(200,255,61,.15); }
  .hint { background: rgba(255,255,255,.04); border: 1px solid var(--edge); border-radius: 18px; color: var(--muted); }
  .hint.open { background: linear-gradient(135deg, rgba(139,92,246,.35), rgba(34,211,238,.18)); border-color: rgba(139,92,246,.6); color: var(--text); }
  .hint.open b { font-size: 16px; }
  .g-head em { color: var(--muted); }
  .g-row { border-top: 1px solid rgba(255,255,255,.07); }
  .g-name b { font-weight: 700; letter-spacing: -.01em; } .g-name small { color: var(--muted); }
  .t { border-radius: 16px; color: #fff; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3); min-height: 56px; }
  .t.hit { background: linear-gradient(145deg, #34e08c, #0d9f5a); box-shadow: 0 0 22px rgba(52,224,140,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  .t.near { background: linear-gradient(145deg, #ffc247, #f08a0c); color: #2a1700; box-shadow: 0 0 22px rgba(255,194,71,.28), inset 0 1px 0 rgba(255,255,255,.4); }
  .t.miss { background: linear-gradient(145deg, #ff6b7d, #c81e45); box-shadow: 0 0 22px rgba(255,107,125,.25), inset 0 1px 0 rgba(255,255,255,.3); }
  .g-row.win .g-name b { color: var(--lime); }
  .legend { color: var(--muted); } .legend i { border-radius: 50%; }
  .legend .hit { background: #34e08c; } .legend .near { background: #ffc247; } .legend .miss { background: #ff6b7d; }
  .d-score span { color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
  .d-score b { font-size: 64px; font-weight: 800; letter-spacing: -.06em; background: linear-gradient(180deg, #fff, var(--lime)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pitch { border-radius: 24px; border: 1px solid var(--edge); background:
    linear-gradient(rgba(200,255,61,.06) 1px, transparent 1px) 0 0 / 100% 8.33%, radial-gradient(circle at 50% 40%, rgba(34,211,238,.1), transparent 60%), rgba(8,14,10,.7); }
  .pitch::before { content: ""; position: absolute; inset: 14px; border: 1.5px solid rgba(200,255,61,.35); border-radius: 14px; }
  .pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 24%; aspect-ratio: 1; translate: -50% -50%; border: 1.5px solid rgba(200,255,61,.35); border-radius: 50%; }
  .slot.filled { background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.22); border-radius: 18px; box-shadow: 0 10px 24px rgba(0,0,0,.4); }
  .slot .r { color: var(--lime); font-weight: 800; text-shadow: 0 0 14px rgba(200,255,61,.6); } .slot small { color: var(--muted); }
  .slot.empty { border: 1.5px dashed rgba(200,255,61,.45); border-radius: 18px; color: var(--lime); background: rgba(200,255,61,.05); }
  .slot.pend { border-color: var(--lime); box-shadow: 0 0 0 3px rgba(200,255,61,.25), 0 0 34px rgba(200,255,61,.35); }
  .acts .ok { background: var(--lime); color: #0b0f05; box-shadow: 0 0 16px rgba(200,255,61,.6); } .acts .undo { background: rgba(255,255,255,.15); backdrop-filter: blur(8px); }
  .intro { color: var(--muted); } .intro b { color: var(--text); }
  .offer { background: rgba(255,255,255,.05); border: 1px solid var(--edge); border-radius: 20px; }
  .offer b { background: linear-gradient(90deg, var(--lime), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
  .offer small { color: var(--muted); } .offer.on { border-color: var(--lime); box-shadow: 0 0 0 1px var(--lime), 0 0 28px rgba(200,255,61,.25); }
  .pl { background: rgba(255,255,255,.05); border: 1px solid var(--edge); border-radius: 14px; } .pl em { color: var(--muted); } .pl b { color: var(--lime); }
  footer { color: var(--muted); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="stile.js"></script>
<script>
  renderMock(document.getElementById('app'), { logo: `<span class="logo-mark"><svg viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8ff3d"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle cx="20" cy="20" r="17" fill="none" stroke="url(#g)" stroke-width="3"/><path d="m20 11 7 5-2.7 8.4h-8.6L13 16z" fill="url(#g)"/><path d="M20 11V3M27 16l8-2.5M24.3 24.4l5 6.6M15.7 24.4l-5 6.6M13 16 5 13.5" stroke="url(#g)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></span>` });
</script>
</body>
</html>
