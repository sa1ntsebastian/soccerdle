<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccerdle – Retro A: Stadionprogramm 1972</title>
<link rel="stylesheet" href="stile-base.css">
<style>
  /* Retro A – Stadionprogramm '72: Marineblau + Rot auf Zeitungspapier, Rasterpunkte, kondensierte Versalien, Mannschaftsaufstellungs-Karten */
  :root { --paper: #efe7d3; --card: #fffaf0; --navy: #14284b; --red: #c8102e; --ink: #141c2b; --muted: #6a6f7d; --line: #d9ceb2; --green: #1f6b48; --amber: #e3a82b;
    --cond: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; --serif: Georgia, "Times New Roman", serif; }
  body { color: var(--ink); font: 15px/1.5 var(--serif); background-color: var(--paper);
    background-image: radial-gradient(rgba(20,40,75,.12) 1px, transparent 1.4px); background-size: 6px 6px; }
  .muted { color: var(--muted); }
  .app { padding: 0 0 40px; max-width: 1040px; }
  .top { padding: 18px 20px 16px; background: var(--navy); color: #fffaf0; position: relative; margin-bottom: 0; }
  .top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -14px; height: 14px; background: repeating-linear-gradient(-45deg, var(--red) 0 10px, #fffaf0 10px 20px, var(--navy) 20px 30px); }
  .logo-mark svg { width: 56px; height: 56px; }
  .wm { font-family: var(--cond); font-weight: 700; font-size: 44px; line-height: .9; letter-spacing: .04em; text-transform: uppercase; }
  .w2 { color: #ff5c73; }
  .logo-txt small { font-family: var(--serif); font-style: italic; color: #c9d3ea; letter-spacing: .04em; margin-top: 4px; }
  .tools button { background: transparent; color: #fffaf0; border: 2px solid #fffaf0; border-radius: 0; }
  .tools button:hover { background: var(--red); border-color: var(--red); }
  .tabs { margin: 30px 16px 16px; gap: 0; border-bottom: 3px solid var(--navy); }
  .tabs button { font-family: var(--cond); font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); flex-direction: row; justify-content: center; gap: 7px; padding: 10px 2px; border-bottom: 5px solid transparent; margin-bottom: -3px; }
  .tabs span { font-size: 15px; }
  .tabs button.on { color: var(--navy); border-bottom-color: var(--red); }
  main { padding: 0 16px; }
  .card { background: var(--card); border: 2px solid var(--navy); border-top: 8px solid var(--navy); border-radius: 0; padding: 18px; position: relative; }
  .card::before { content: ""; position: absolute; left: 0; top: -8px; width: 70px; height: 8px; background: var(--red); }
  .subtabs button { background: none; border: 2px solid var(--navy); font-family: var(--cond); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
  .subtabs button + button { border-left: 0; } .subtabs .on { background: var(--navy); color: #fffaf0; }
  .play-top b { font-family: var(--cond); font-size: 34px; text-transform: uppercase; letter-spacing: .03em; line-height: 1; color: var(--navy); }
  .yest { font-style: italic; color: var(--muted); } .yest b { font-style: normal; color: var(--red); }
  .search { background: #fff; border: 2px solid var(--navy); border-radius: 0; color: var(--muted); box-shadow: 4px 4px 0 rgba(20,40,75,.25); }
  .hint { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--navy); color: var(--muted); }
  .hint i { font-family: var(--cond); font-size: 13px; color: var(--navy); } .hint.open { border-left-color: var(--red); background: #fff3d6; color: var(--ink); }
  .g-head em { font-family: var(--cond); font-size: 13px; color: var(--navy); }
  .g-row { border-top: 1px solid var(--line); }
  .g-name b { font-family: var(--cond); font-size: 18px; text-transform: uppercase; letter-spacing: .03em; color: var(--navy); } .g-name small { font-style: italic; color: var(--muted); }
  .t { border-radius: 0; font-family: var(--cond); font-size: 20px; letter-spacing: .03em; color: #fff; border-bottom: 5px solid rgba(0,0,0,.25); }
  .t.hit { background: var(--green); } .t.near { background: var(--amber); color: #2b1f00; } .t.miss { background: var(--red); }
  .flag { border: 1px solid rgba(0,0,0,.4); border-radius: 0; width: 30px; height: 20px; }
  .g-row.win .g-name b { color: var(--red); }
  .legend { font-style: italic; color: var(--muted); } .legend .hit { background: var(--green); } .legend .near { background: var(--amber); } .legend .miss { background: var(--red); }
  .d-score span { font-family: var(--cond); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .d-score b { font-family: var(--cond); font-size: 76px; line-height: .9; color: var(--navy); } .d-score { position: relative; }
  .pitch { background: repeating-linear-gradient(90deg, #2f7a4a 0 12.5%, #2a6f43 12.5% 25%); border: 3px solid var(--navy); outline: 3px solid var(--card); outline-offset: -9px; }
  .pitch::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 3px solid rgba(255,250,240,.9); }
  .pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 24%; aspect-ratio: 1; translate: -50% -50%; border: 3px solid rgba(255,250,240,.9); border-radius: 50%; }
  /* Spielerkarte wie auf dem Mannschaftsbogen: Nummernblock links */
  .slot.filled { display: grid; grid-template-columns: 30px 1fr; width: 106px; min-height: 0; padding: 0; text-align: left; background: #fffaf0; border: 2px solid var(--navy); box-shadow: 3px 3px 0 rgba(0,0,0,.35); }
  .slot .r { grid-row: 1 / 3; background: var(--navy); color: #fffaf0; font-family: var(--cond); font-size: 24px; display: grid; place-items: center; width: 30px; height: 100%; min-height: 40px; }
  .slot .n { font-family: var(--cond); font-size: 15px; text-transform: uppercase; padding: 4px 6px 0; color: var(--navy); }
  .slot small { padding: 0 6px 4px; font-style: italic; color: var(--muted); }
  .slot.empty { border: 3px dashed rgba(255,250,240,.85); color: #fffaf0; background: rgba(0,0,0,.15); font-family: var(--cond); font-size: 18px; }
  .slot.pend { outline: 3px solid var(--amber); }
  .acts .ok { background: var(--green); color: #fff; border: 2px solid #fffaf0; } .acts .undo { background: #fffaf0; border: 2px solid var(--navy); }
  .intro { font-style: italic; color: var(--muted); } .intro b { font-style: normal; color: var(--ink); }
  .offer { background: #fff; border: 2px solid var(--navy); border-radius: 0; font-family: var(--cond); border-bottom: 6px solid var(--navy); }
  .offer span { font-size: 17px; text-transform: uppercase; letter-spacing: .04em; } .offer b { font-size: 30px; color: var(--red); line-height: 1; } .offer small { font-family: var(--serif); font-style: italic; color: var(--muted); }
  .offer.on { background: var(--navy); color: #fffaf0; border-bottom-color: var(--red); } .offer.on b { color: #ff8c9c; } .offer.on small { color: #c9d3ea; }
  .pl { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--navy); } .pl em { font-family: var(--cond); font-size: 15px; color: var(--red); } .pl b { font-family: var(--cond); font-size: 24px; color: var(--navy); }
  footer { font-style: italic; color: var(--muted); } footer::before { content: "OFFIZIELLES PROGRAMM · SAISON 2026/27"; display: block; font-family: var(--cond); font-style: normal; letter-spacing: .2em; color: var(--navy); margin-bottom: 4px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="stile.js"></script>
<script>
  renderMock(document.getElementById('app'), { logo: `<span class="logo-mark"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#c8102e" stroke="#fffaf0" stroke-width="3"/><circle cx="32" cy="32" r="21" fill="#fffaf0"/><path d="m32 20 8.5 6.2-3.2 10H26.7l-3.2-10z" fill="#14284b"/><path d="M32 20v-8M40.5 26.2l7.6-2.5M37.3 36.2l4.7 6.5M26.7 36.2l-4.7 6.5M23.5 26.2l-7.6-2.5" stroke="#14284b" stroke-width="2.6" fill="none"/></svg></span>` });
</script>
</body>
</html>
