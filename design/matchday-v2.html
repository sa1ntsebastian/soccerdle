<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccerdle – Matchday v2</title>
<style>
  /* ---------- Schriften (selbst gehostet, OFL) ---------- */
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap;
    src: url(../web/fonts/barlow-condensed-600-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap;
    src: url(../web/fonts/barlow-condensed-600-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap;
    src: url(../web/fonts/barlow-condensed-700-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap;
    src: url(../web/fonts/barlow-condensed-700-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap;
    src: url(../web/fonts/inter-var-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap;
    src: url(../web/fonts/inter-var-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2C60-2C7F, U+A720-A7FF; }

  /* ---------- Farben: hell (Standard) ---------- */
  :root {
    --display: "Barlow Condensed", "Bahnschrift", "Arial Narrow", sans-serif;
    --body: "Inter", system-ui, "Segoe UI", sans-serif;
    --bg: #eef1ec; --card: #ffffff; --card-2: #f5f7f3; --text: #121a15; --muted: #5f6d64; --line: #dde3da;
    --brand: #1f7a45; --brand-ink: #ffffff;
    --hero-1: #1d6b3d; --hero-2: #217544; --hero-line: rgba(255,255,255,.22);
    --hit: #1f9d55; --near: #e8a019; --miss: #d64541;
    --hit-ink: #fff; --near-ink: #2b1d00; --miss-ink: #fff;
    --badge: #121a15; --badge-ink: #fff;
    --shadow: 0 1px 2px rgba(16,32,22,.06), 0 6px 20px rgba(16,32,22,.07);
    --radius: 10px;
    color-scheme: light;
  }
  /* ---------- Farben: dunkel ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b100d; --card: #141b17; --card-2: #1a231e; --text: #e7ede9; --muted: #8e9c93; --line: #25302a;
      --brand: #35b56a; --brand-ink: #06120a;
      --hero-1: #0f2a1b; --hero-2: #12301f; --hero-line: rgba(255,255,255,.10);
      --hit: #1e8f4e; --near: #d4911a; --miss: #c23e3a;
      --badge: #e7ede9; --badge-ink: #0b100d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b100d; --card: #141b17; --card-2: #1a231e; --text: #e7ede9; --muted: #8e9c93; --line: #25302a;
    --brand: #35b56a; --brand-ink: #06120a;
    --hero-1: #0f2a1b; --hero-2: #12301f; --hero-line: rgba(255,255,255,.10);
    --hit: #1e8f4e; --near: #d4911a; --miss: #c23e3a;
    --badge: #e7ede9; --badge-ink: #0b100d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--body);
    -webkit-font-smoothing: antialiased; transition: background .2s; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- Kopfbereich ---------- */
  .hero { background: repeating-linear-gradient(90deg, var(--hero-1) 0 56px, var(--hero-2) 56px 112px);
    color: #fff; padding: 14px 16px 62px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; left: 50%; bottom: -84px; width: 168px; height: 168px; translate: -50% 0;
    border: 2px solid var(--hero-line); border-radius: 50%; }
  .hero::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; border-top: 2px solid var(--hero-line); }
  .hero-inner { max-width: 780px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark { width: 34px; height: 34px; border-radius: 8px; background: #fff; display: grid; place-items: center; }
  .logo-mark svg { width: 24px; height: 24px; }
  .logo h1 { margin: 0; font: 700 30px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; }
  .logo h1 span { opacity: .65; }
  .logo small { display: block; font: 600 12px/1 var(--body); letter-spacing: 1.2px; text-transform: uppercase; opacity: .75; margin-top: 4px; white-space: nowrap; }
  @media (max-width: 420px) { .logo small { font-size: 10px; letter-spacing: .6px; } }
  .hero-actions { display: flex; gap: 6px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:hover { background: rgba(255,255,255,.16); }

  .wrap { max-width: 780px; margin: -42px auto 0; padding: 0 16px 40px; position: relative; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }

  /* ---------- Modi ---------- */
  .modes { display: flex; padding: 4px; margin-bottom: 12px; gap: 4px; overflow-x: auto; }
  .mode { flex: 1; white-space: nowrap; border: 0; background: transparent; padding: 9px 12px; border-radius: 7px;
    font: 700 15px/1 var(--display); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .mode.active { background: var(--brand); color: var(--brand-ink); }

  /* ---------- Spielbereich ---------- */
  .play { padding: 16px; margin-bottom: 14px; }
  .play-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .play-top b { font: 700 20px/1 var(--display); letter-spacing: .5px; text-transform: uppercase; }
  .play-top span { color: var(--muted); font-size: 13px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; }
  .search input { width: 100%; padding: 13px 14px 13px 42px; font: inherit; font-size: 16px; color: var(--text);
    border-radius: 8px; border: 1px solid var(--line); background: var(--card-2); outline: none; }
  .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }

  .hints { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .hint { border-radius: 8px; padding: 8px 8px; text-align: center; background: var(--card-2); border: 1px dashed var(--line); }
  .hint.open { border: 1px solid var(--brand); background: color-mix(in srgb, var(--brand) 8%, var(--card)); }
  .hint .lbl { font: 600 11px/1.2 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .hint .val { font: 700 17px/1.2 var(--display); letter-spacing: .3px; margin-top: 3px; }
  .hint .lock { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 4px; justify-content: center; align-items: center; }
  .ico-lock { width: 12px; height: 12px; fill: currentColor; }

  /* ---------- Tipps ---------- */
  .guess { padding: 12px; margin-bottom: 10px; display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: center; }
  .guess.win { border-color: var(--hit); box-shadow: 0 0 0 1px var(--hit), var(--shadow); }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .num-badge { flex: none; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
    background: var(--card-2); border: 1px solid var(--line); font: 700 20px/1 var(--display); color: var(--muted); }
  .guess.win .num-badge { background: var(--hit); border-color: var(--hit); color: #fff; }
  .who > div { min-width: 0; }
  .who .n { font: 700 18px/1.05 var(--display); letter-spacing: .2px; }
  .who .c { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  .chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .chip { border-radius: 8px; padding: 6px 4px 7px; text-align: center; position: relative; min-height: 80px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2px; }
  .chip .k { font: 600 10px/1 var(--body); text-transform: uppercase; letter-spacing: .7px; opacity: .78; }
  .chip .v { font: 600 11.5px/1.1 var(--body); }
  .chip .num { font: 700 28px/1 var(--display); }
  .chip .league { font: 700 15px/1.05 var(--display); letter-spacing: .3px; text-transform: uppercase; }
  .chip.hit  { background: var(--hit);  color: var(--hit-ink); }
  .chip.near { background: var(--near); color: var(--near-ink); }
  .chip.miss { background: var(--miss); color: var(--miss-ink); }
  .chip[data-tip] { cursor: help; }
  .info { position: absolute; top: 5px; right: 6px; width: 13px; height: 13px; opacity: .8; }
  .arrow { position: absolute; top: -7px; right: -5px; width: 22px; height: 22px; border-radius: 6px;
    background: var(--badge); color: var(--badge-ink); display: grid; place-items: center; box-shadow: 0 2px 5px rgba(0,0,0,.25); }
  .arrow svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  .flag { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px rgba(255,255,255,.8); }
  .ico-pitch { width: 42px; height: 28px; }
  .ico-pitch rect { fill: rgba(255,255,255,.2); }
  .ico-pitch rect.on { fill: #fff; }
  .chip.near .ico-pitch rect { fill: rgba(43,29,0,.14); } .chip.near .ico-pitch rect.on { fill: var(--near-ink); }
  .ico-pitch .line { fill: none; stroke: currentColor; stroke-opacity: .55; stroke-width: 1.2; }
  .ico-feet { width: 30px; height: 27px; }
  .ico-feet path { fill: currentColor; opacity: .25; }
  .ico-feet path.on { opacity: 1; }

  /* Tooltip (Hover am PC, Antippen am Handy) */
  .tip { position: absolute; z-index: 10; bottom: calc(100% + 8px); left: 50%; translate: -50% 0; width: 190px;
    background: var(--badge); color: var(--badge-ink); font: 500 12px/1.35 var(--body); padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.25); text-align: left; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .tip::after { content: ""; position: absolute; top: 100%; left: 50%; translate: -50% 0; border: 6px solid transparent; border-top-color: var(--badge); }
  .chip:hover .tip, .chip.show-tip .tip { opacity: 1; }

  .reveal .chip { animation: flip .45s ease both; }
  .reveal .chip:nth-child(2) { animation-delay: .07s } .reveal .chip:nth-child(3) { animation-delay: .14s }
  .reveal .chip:nth-child(4) { animation-delay: .21s } .reveal .chip:nth-child(5) { animation-delay: .28s }
  .reveal .chip:nth-child(6) { animation-delay: .35s } .reveal .chip:nth-child(7) { animation-delay: .42s }
  @keyframes flip { from { transform: perspective(400px) rotateX(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .reveal .chip { animation: none; } }

  .legend { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 16px 0 0; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }

  @media (max-width: 620px) {
    .guess { grid-template-columns: 1fr; gap: 9px; }
    .chips { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .chip { min-height: 72px; }
    .logo h1 { font-size: 26px; }
    .tip { width: 160px; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="logo">
        <div class="logo-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1f7a45"/><path d="M12 7l3.3 2.4-1.3 3.9h-4l-1.3-3.9z" fill="#fff"/><path d="M12 7V3.5M15.3 9.4l3.4-1.1M14 13.3l2.1 3.2M10 13.3l-2.1 3.2M8.7 9.4L5.3 8.3" stroke="#fff" stroke-width="1.3"/></svg></div>
        <div><h1>Soccer<span>dle</span></h1><small>Champions League 2026/27</small></div>
      </div>
      <div class="hero-actions">
        <button class="icon-btn" id="theme" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel">
          <svg viewBox="0 0 24 24" id="theme-ico"></svg></button>
        <button class="icon-btn" aria-label="Statistik" title="Statistik">
          <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
        <button class="icon-btn" aria-label="Spielregeln" title="Spielregeln">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg></button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <nav class="card modes">
      <button class="mode active">Täglich</button>
      <button class="mode">Endlos</button>
      <button class="mode">Ligen</button>
    </nav>

    <section class="card play">
      <div class="play-top"><b>Rätsel #4</b><span>5 Versuche</span></div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input placeholder="Spielername eingeben …" aria-label="Spieler suchen">
      </div>
      <div class="hints" id="hints"></div>
    </section>

    <section id="guesses"></section>

    <div class="legend">
      <span><i style="background:var(--hit)"></i>richtig</span>
      <span><i style="background:var(--near)"></i>knapp / teilweise</span>
      <span><i style="background:var(--miss)"></i>falsch</span>
    </div>
  </div>

<script src="shared.js"></script>
<script>
  const { rows, hints } = MOCK;
  const ARROW = { up: '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
                  down: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>' };
  const INFO = '<svg class="info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>';

  document.getElementById('hints').innerHTML = hints.map(h => `
    <div class="hint${h.open ? ' open' : ''}"><div class="lbl">${h.label}</div>
      ${h.open ? `<div class="val">${h.value}</div>` : `<div class="lock">${ICONS.lock} in ${h.left}</div>`}
    </div>`).join('');

  const num = (k, [v, s, d], unit = '') =>
    `<div class="chip ${s}"><span class="k">${k}</span><span class="num">${v}</span><span class="v">${unit || '&nbsp;'}</span>${d ? `<span class="arrow">${ARROW[d]}</span>` : ''}</div>`;

  document.getElementById('guesses').innerHTML = rows.map((r, i) => {
    const other = r.league[0] === 'Andere';
    const tip = other ? `<span class="tip">Keine Top-5-Liga. Grün hieße: Der Gesuchte spielt auch außerhalb der Top 5 – ob in derselben Liga, wird nicht verraten.</span>` : '';
    return `
    <article class="card guess${r.win ? ' win' : ''}${i === 0 ? ' reveal' : ''}">
      <div class="who"><div class="num-badge">${r.number[0]}</div>
        <div><div class="n">${r.name}</div><div class="c">${r.club}</div></div></div>
      <div class="chips">
        <div class="chip ${r.league[1]}" ${other ? 'data-tip tabindex="0"' : ''}><span class="k">Liga</span><span class="league">${r.league[0]}</span><span class="v">&nbsp;</span>${other ? INFO + tip : ''}</div>
        <div class="chip ${r.nat[2]}"><span class="k">Nation</span>${ICONS.flag(r.nat[0])}<span class="v">${r.nat[1]}</span></div>
        <div class="chip ${r.pos[1]}"><span class="k">Position</span>${ICONS.pitch(r.pos[0])}<span class="v">${r.pos[0].join(' / ')}</span></div>
        ${num('Alter', r.age, 'Jahre')}
        ${num('Größe', r.height, 'cm')}
        <div class="chip ${r.foot[1]}"><span class="k">Fuß</span>${ICONS.feet(r.foot[0])}<span class="v">${FOOT_TEXT[r.foot[0]]}</span></div>
        ${num('Nr.', r.number)}
      </div>
    </article>`; }).join('');

  // Tooltip am Handy: antippen zum Ein-/Ausblenden
  document.addEventListener('click', e => {
    const chip = e.target.closest('.chip[data-tip]');
    document.querySelectorAll('.chip.show-tip').forEach(c => c !== chip && c.classList.remove('show-tip'));
    if (chip) chip.classList.toggle('show-tip');
  });

  // Hell/Dunkel: ?theme=dark|light in der URL (für Screenshots), sonst gespeicherte Wahl, sonst Systemeinstellung
  const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const MOON = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
  const root = document.documentElement;
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const paintIcon = () => document.getElementById('theme-ico').innerHTML = isDark() ? SUN : MOON;
  let saved = new URLSearchParams(location.search).get('theme');
  if (!saved) { try { saved = localStorage.getItem('soccerdle-theme'); } catch {} }
  if (saved) root.dataset.theme = saved;
  paintIcon();
  document.getElementById('theme').onclick = () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('soccerdle-theme', root.dataset.theme); } catch {}
    paintIcon();
  };
</script>
</body>
</html>
